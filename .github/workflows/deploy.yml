name: Create Documentation Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v (e.g., v1.0, v2.1.3)

permissions:
  contents: write # Required to create a release and upload assets

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Documentation
        run: |
          # Zip the current folder contents (excluding git files)
          zip -r docs.zip . -x "*.git*" ".github*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs.zip
          # The release name will be the tag name (e.g., v1.0.1)
          name: Documentation Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
