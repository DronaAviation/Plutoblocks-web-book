name: Release Documentation Update

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Version and Zip
        run: |
          # 1. Create the version file
          echo "{\"tag\": \"${{ github.ref_name }}\", \"updated\": \"$(date)\"}" > version.json
          
          # 2. Zip the contents
          # We explicitly exclude standard node_modules/ but because you 
          # copied @electron into the root, it will be included.
          zip -r docs.zip . -x "*.git*" ".github*" "node_modules/*"

      - name: Create Doc Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs.zip
          name: Documentation Update ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
